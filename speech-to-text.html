<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech to Text - Simple & Reliable</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .language-selector {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background-color: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:hover {
            border-color: #667eea;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 150px;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-start:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-start:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-stop {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-stop:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(245, 87, 108, 0.4);
        }

        .btn-stop:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-clear {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            color: #333;
        }

        .btn-clear:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(253, 203, 110, 0.4);
        }

        .btn-copy {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #333;
        }

        .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(168, 237, 234, 0.4);
        }

        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 1.1em;
        }

        .status.idle {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status.listening {
            background: #fff3e0;
            color: #e65100;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
        }

        .transcript-container {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            border: 2px solid #ddd;
            margin-bottom: 20px;
        }

        .transcript {
            font-size: 1.1em;
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .transcript:empty::before {
            content: 'Your transcription will appear here...';
            color: #999;
            font-style: italic;
        }

        .info {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 5px;
        }

        .info h3 {
            color: #1976d2;
            margin-bottom: 10px;
        }

        .info p {
            color: #555;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Speech to Text</h1>
        <p class="subtitle">Simple & Reliable Voice Recognition</p>

        <div class="language-selector">
            <label for="language">Select Language:</label>
            <select id="language">
                <option value="en-US">🇺🇸 English (United States)</option>
                <option value="en-GB">🇬🇧 English (United Kingdom)</option>
                <option value="pt-BR">🇧🇷 Portuguese (Brazil)</option>
                <option value="pt-PT">🇵🇹 Portuguese (Portugal)</option>
                <option value="es-ES">🇪🇸 Spanish (Spain)</option>
                <option value="es-MX">🇲🇽 Spanish (Mexico)</option>
                <option value="es-AR">🇦🇷 Spanish (Argentina)</option>
            </select>
        </div>

        <div class="button-group">
            <button id="startBtn" class="btn-start">▶ Start</button>
            <button id="stopBtn" class="btn-stop" disabled>⏹ Stop</button>
            <button id="clearBtn" class="btn-clear">🗑 Clear</button>
            <button id="copyBtn" class="btn-copy">📋 Copy</button>
        </div>

        <div id="status" class="status idle">Ready to start</div>

        <div class="transcript-container">
            <div id="transcript" class="transcript"></div>
        </div>

        <div class="info">
            <h3>ℹ️ How to Use:</h3>
            <p>
                1. Select your language from the dropdown<br>
                2. Click "Start" and allow microphone access<br>
                3. Speak clearly into your microphone<br>
                4. Click "Stop" when finished<br>
                5. Use "Copy" to copy the text<br>
                6. Use "Clear" to reset
            </p>
        </div>
    </div>

    <script>
        // Check for browser support
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            document.getElementById('status').className = 'status error';
            document.getElementById('status').textContent = '❌ Speech recognition not supported. Please use Chrome, Edge, or Safari.';
            document.getElementById('startBtn').disabled = true;
        } else {
            // Initialize
            const recognition = new SpeechRecognition();
            const languageSelect = document.getElementById('language');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const clearBtn = document.getElementById('clearBtn');
            const copyBtn = document.getElementById('copyBtn');
            const statusDiv = document.getElementById('status');
            const transcriptDiv = document.getElementById('transcript');

            // Configure recognition
            recognition.lang = languageSelect.value;
            recognition.continuous = false; // Simple mode: one phrase at a time
            recognition.interimResults = true;

            // Update language when changed
            languageSelect.addEventListener('change', () => {
                recognition.lang = languageSelect.value;
            });

            // Start button
            startBtn.addEventListener('click', () => {
                try {
                    recognition.start();
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    statusDiv.className = 'status listening';
                    statusDiv.textContent = '🎙️ Listening... Speak now!';
                } catch (error) {
                    statusDiv.className = 'status error';
                    statusDiv.textContent = '❌ Error: ' + error.message;
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                }
            });

            // Stop button
            stopBtn.addEventListener('click', () => {
                recognition.stop();
            });

            // Clear button
            clearBtn.addEventListener('click', () => {
                transcriptDiv.textContent = '';
                statusDiv.className = 'status idle';
                statusDiv.textContent = 'Ready to start';
            });

            // Copy button
            copyBtn.addEventListener('click', async () => {
                const text = transcriptDiv.textContent;
                if (!text) {
                    statusDiv.className = 'status error';
                    statusDiv.textContent = '❌ No text to copy';
                    setTimeout(() => {
                        statusDiv.className = 'status idle';
                        statusDiv.textContent = 'Ready to start';
                    }, 2000);
                    return;
                }

                try {
                    await navigator.clipboard.writeText(text);
                    statusDiv.className = 'status idle';
                    statusDiv.textContent = '✓ Text copied!';
                    setTimeout(() => {
                        statusDiv.textContent = 'Ready to start';
                    }, 2000);
                } catch (error) {
                    statusDiv.className = 'status error';
                    statusDiv.textContent = '❌ Failed to copy';
                }
            });

            // Handle results
            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }

                if (finalTranscript) {
                    transcriptDiv.textContent += finalTranscript;
                }

                if (interimTranscript) {
                    statusDiv.textContent = '🎙️ ' + interimTranscript;
                }
            };

            // Handle end
            recognition.onend = () => {
                startBtn.disabled = false;
                stopBtn.disabled = true;
                statusDiv.className = 'status idle';
                statusDiv.textContent = '✓ Recording complete. Click Start to record again.';
            };

            // Handle errors
            recognition.onerror = (event) => {
                startBtn.disabled = false;
                stopBtn.disabled = true;

                if (event.error === 'aborted') {
                    statusDiv.className = 'status idle';
                    statusDiv.textContent = '✓ Stopped';
                    return;
                }

                if (event.error === 'no-speech') {
                    statusDiv.className = 'status idle';
                    statusDiv.textContent = 'No speech detected. Click Start to try again.';
                    return;
                }

                statusDiv.className = 'status error';
                let message = '❌ Error: ';
                switch(event.error) {
                    case 'audio-capture':
                        message += 'No microphone found';
                        break;
                    case 'not-allowed':
                        message += 'Microphone permission denied';
                        break;
                    case 'network':
                        message += 'Network error';
                        break;
                    default:
                        message += event.error;
                }
                statusDiv.textContent = message;
            };
        }
    </script>
</body>
</html>
